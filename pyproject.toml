[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin-sync-hub"
version = "1.0.0"
description = "Garmin Connect automations: Liftosaur workouts to Garmin, and Zwift maps on your watch activities"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["garmin", "liftosaur", "zwift", "fit-file", "sync"]
dependencies = [
    "garminconnect==0.3.20",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "fit-tool>=0.9.15",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12", "httpx>=0.27"]

[project.scripts]
garmin-sync-hub = "garmin_sync_hub.cli:main"

[project.urls]
Homepage = "https://github.com/Jeffs24/garmin-sync-hub"
Repository = "https://github.com/Jeffs24/garmin-sync-hub"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_sync_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/zwift"]
