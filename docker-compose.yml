services:
  garmin-sync-hub:
    # Published on each GitHub release (see the Releases page). Pre-releases are not tagged :latest.
    image: ghcr.io/jeffs24/garmin-sync-hub:0.4.0
    # To build from source instead, comment out `image` above and uncomment:
    # build: .
    container_name: garmin-sync-hub
    restart: unless-stopped
    ports:
      - "8127:8127"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data
